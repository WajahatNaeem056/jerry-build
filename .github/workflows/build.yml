name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --warning-mode all assembleRelease

      - name: Collect files
        run: |
          mkdir -p out/zygisk
          cp module/classes.dex out/classes.dex
          cp module/zygisk/*.so out/zygisk/
          ls -l out out/zygisk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jerry-spoof-binaries
          path: out/
